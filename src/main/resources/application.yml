server:
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript

spring:
  application:
    name: allfolio
  autoconfigure:
    # JWT 기반 무상태 인증이므로 인메모리 UserDetailsService가 필요 없다.
    # 제외하지 않으면 부팅 시 랜덤 생성 비밀번호가 로그에 남는다.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/allfolio
    username: allfolio
    password: allfolio
  data:
    redis:
      host: localhost
      port: 6379
  http:
    # Spring Boot 4.1에서 RestClient.Builder의 기본 타임아웃 프로퍼티 프리픽스가 "client"(단수)가 아닌
    # "clients"(복수)로 바뀌었다(실측: HttpClientsProperties가 spring.http.clients에 바인딩됨, 단수형
    # spring.http.client는 조용히 무시되어 타임아웃이 전혀 적용되지 않았었다).
    clients:
      connect-timeout: 2s
      read-timeout: 3s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

allfolio:
  jwt:
    # 하드코딩 금지 (docs/ROADMAP.md Task 003) — 환경변수 주입. 미설정 시 부팅 실패시켜 조용한 약한 키 사용을 막는다.
    secret: ${ALLFOLIO_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  upbit:
    base-url: https://api.upbit.com
  exchange-rate:
    base-url: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest
  stock:
    base-url: https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService
    service-key: ${ALLFOLIO_STOCK_SERVICE_KEY:}
  twelvedata:
    base-url: https://api.twelvedata.com
    api-key: ${ALLFOLIO_TWELVEDATA_API_KEY:}
  fcm:
    # Firebase 서비스 계정 JSON을 한 줄로 압축한 문자열. 미설정 시에도 부팅은 정상적으로 되고,
    # 실제 발송 시점에만 실패한다(ALLFOLIO_STOCK_SERVICE_KEY와 동일 패턴, .claude/agents/firebase-fcm.md).
    credentials-json: ${ALLFOLIO_FCM_CREDENTIALS_JSON:}
  price-cache:
    coin-fresh-ttl: 10s
    stock-fresh-ttl: 12h
    # Twelve Data 무료 API 호출 한도(분당 8회)와의 절충값(Task 025).
    stock-us-fresh-ttl: 1m
    cash-usd-fresh-ttl: 12h
    stale-ceiling: 24h
    # Task 023 Major 2: 시세 조회 실패(존재하지 않는 티커 등) 부정 캐싱 TTL. 30초 — 너무 짧으면 남용
    # 방지 효과가 없고, 너무 길면 티커가 나중에 정상 등록돼도 한동안 계속 실패로 응답한다.
    negative-ttl: 30s
    # CandlePushScheduler.pollAndPush()의 구독 키 fan-out 병렬 폴링 동시성 상한(Task 031 k6 부하테스트
    # 후속 — 구독 키 500개 무제한 fan-out으로 업비트 429·CB half_open 재발 실측). 20~30 사이 보수적인
    # 값으로 시작, k6 재측정으로 조정 가능. 이 키가 통째로 빠져도 PriceCacheProperties의
    # @DefaultValue("25")가 동일한 값으로 폴백한다(code-reviewer Major 3) — 0/음수는 @Positive로
    # 부팅 시점에 거부된다.
    upbit-poll-concurrency: 25
  price-throttle:
    limit: 1
    window: 1s
  # STOCK(국내+해외 공통) 일봉 원본 캐시(Task 028 「캔들 캐시·집계·페이징 인프라」). 캔들 서비스 레이어는
  # 후속 태스크지만, 이 인프라의 TTL·범위 상한·락 만료는 여기서 함께 확정한다.
  candle-cache:
    # EOD(하루 1회 갱신) 데이터라 price-cache.stock-fresh-ttl과 동일하게 길게 둔다.
    stock-daily-ttl: 12h
    # 캔들 차트가 다루는 최대 조회 범위 상한(연 단위) — 무한정 과거로 캐시가 확장되는 것을 막는다.
    max-history-years: 10
    # cache stampede 방지용 티커 단위 락(CandleRangeLock) 만료 시간. 국내주식 10년 콜드 페치 실측
    # 4.60초(connect-timeout 2s + read-timeout 3s 대비 재시도·오버헤드 포함)에 여유를 두어 15초로
    # 잡는다 — 5초로는 벤더가 조금만 느려져도 fetch 도중 락이 만료돼 cache stampede 방지 목적이
    # 무력화된다(Task 028 code-reviewer m3 실측).
    range-lock-ttl: 15s
  # COIN 캔들 조회(GET /v1/assets/{id}/candles, COIN 자산) 사용자당 Throttle(Task 031 서브태스크 4).
  # 이 경로는 캐시가 전혀 없는 순수 패스스루라(candle-cache는 STOCK 전용) 30 VUs·30초 부하만으로도
  # 업비트가 실제 429를 반환하기 시작하고 우리 서버 응답의 98%가 503으로 저하됨을 실측 확인했다
  # (loadtest/results.md 시나리오 4). PriceThrottle(1건/1초)보다 약간 여유를 둔 값 — 근거는
  # CandleThrottleProperties Javadoc 참고.
  candle-throttle:
    limit: 3
    window: 1s
  # 통합 종목 검색(GET /v1/assets/search) 결과 캐시(Task 026 서브태스크 3). 종목명·마켓 목록은
  # 시세와 달리 실시간성이 필요 없어 하루 단위로 넉넉하게 잡는다.
  search-cache:
    ttl: 6h
  # 프론트 디바운스(350ms) 1회 발동은 KRW/USD 검색을 병렬 2건 호출한다(SearchCombobox.runSearch —
  # GET /v1/assets/search가 currency를 필수 파라미터로 요구해 프론트가 나눠 호출, Task 026·027-A).
  # 350ms 간격으로 쉬지 않고 10초간 계속 타이핑하는 극단적 케이스: 10s/350ms≈28회 발동×2건=최대 56건.
  # "디바운스 1회=1건"을 가정한 기존 30건/10s로는 15회(5.25초)만에 429가 나 부족했으므로 60건/10s로
  # 상향한다(Task 027 이월 갭 수정).
  search-throttle:
    limit: 60
    window: 10s

resilience4j:
  circuitbreaker:
    instances:
      upbit:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        # 존재하지 않는 마켓 코드(정상 200 + 빈 배열)는 외부 서비스 장애가 아니라 클라이언트 입력
        # 오류이므로 CB 실패 집계에서 제외한다.
        ignore-exceptions:
          - com.allfolio.domain.exception.TickerNotFoundException
      exchange-rate:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
      stock:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        # 요청 티커와 일치하는 종목코드가 없음(정상 200 응답, 매칭 실패)은 외부 서비스 장애가 아니라
        # 클라이언트 입력 오류이므로 CB 실패 집계에서 제외한다.
        ignore-exceptions:
          - com.allfolio.domain.exception.TickerNotFoundException
      twelvedata:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        # 존재하지 않는 심볼(정상 HTTP 404)은 외부 서비스 장애가 아니라 클라이언트 입력 오류이므로
        # CB 실패 집계에서 제외한다.
        ignore-exceptions:
          - com.allfolio.domain.exception.TickerNotFoundException
      fcm:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        # 자격증명 미설정(ALLFOLIO_FCM_CREDENTIALS_JSON 빈 값)은 외부 서비스 장애가 아니라 배포 설정
        # 문제이므로 CB 실패 집계에서 제외한다(code-reviewer B2, 위 stock/upbit/twelvedata의
        # TickerNotFoundException 제외 패턴과 동일한 이유).
        ignore-exceptions:
          - com.allfolio.infra.push.FcmNotConfiguredException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        allfolio.simulation.duration: true
        allfolio.price.fetch.duration: true
        allfolio.portfolio.price.fetch.duration: true

logging:
  level:
    root: INFO
    com.allfolio: DEBUG
