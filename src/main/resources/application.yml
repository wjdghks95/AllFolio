spring:
  application:
    name: allfolio
  autoconfigure:
    # JWT 기반 무상태 인증이므로 인메모리 UserDetailsService가 필요 없다.
    # 제외하지 않으면 부팅 시 랜덤 생성 비밀번호가 로그에 남는다.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/allfolio
    username: allfolio
    password: allfolio
  data:
    redis:
      host: localhost
      port: 6379
  http:
    client:
      connect-timeout: 2s
      read-timeout: 3s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

allfolio:
  jwt:
    # 하드코딩 금지 (docs/ROADMAP.md Task 003) — 환경변수 주입. 미설정 시 부팅 실패시켜 조용한 약한 키 사용을 막는다.
    secret: ${ALLFOLIO_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
  upbit:
    base-url: https://api.upbit.com
  exchange-rate:
    base-url: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest
  stock:
    base-url: https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService
    service-key: ${ALLFOLIO_STOCK_SERVICE_KEY:}
  twelvedata:
    base-url: https://api.twelvedata.com
    api-key: ${ALLFOLIO_TWELVEDATA_API_KEY:}
  price-cache:
    coin-fresh-ttl: 10s
    stock-fresh-ttl: 12h
    # Twelve Data 무료 API 호출 한도(분당 8회)와의 절충값(Task 025).
    stock-us-fresh-ttl: 1m
    cash-usd-fresh-ttl: 12h
    stale-ceiling: 24h
    # Task 023 Major 2: 시세 조회 실패(존재하지 않는 티커 등) 부정 캐싱 TTL. 30초 — 너무 짧으면 남용
    # 방지 효과가 없고, 너무 길면 티커가 나중에 정상 등록돼도 한동안 계속 실패로 응답한다.
    negative-ttl: 30s
  price-throttle:
    limit: 1
    window: 1s
  # STOCK(국내+해외 공통) 일봉 원본 캐시(Task 028 「캔들 캐시·집계·페이징 인프라」). 캔들 서비스 레이어는
  # 후속 태스크지만, 이 인프라의 TTL·범위 상한·락 만료는 여기서 함께 확정한다.
  candle-cache:
    # EOD(하루 1회 갱신) 데이터라 price-cache.stock-fresh-ttl과 동일하게 길게 둔다.
    stock-daily-ttl: 12h
    # 캔들 차트가 다루는 최대 조회 범위 상한(연 단위) — 무한정 과거로 캐시가 확장되는 것을 막는다.
    max-history-years: 10
    # cache stampede 방지용 티커 단위 락(CandleRangeLock) 만료 시간. 벤더 API 호출 1건이 끝나기에
    # 충분히 짧게 둔다.
    range-lock-ttl: 5s
  # 통합 종목 검색(GET /v1/assets/search) 결과 캐시(Task 026 서브태스크 3). 종목명·마켓 목록은
  # 시세와 달리 실시간성이 필요 없어 하루 단위로 넉넉하게 잡는다.
  search-cache:
    ttl: 6h
  # 프론트 디바운스(350ms) 1회 발동은 KRW/USD 검색을 병렬 2건 호출한다(SearchCombobox.runSearch —
  # GET /v1/assets/search가 currency를 필수 파라미터로 요구해 프론트가 나눠 호출, Task 026·027-A).
  # 350ms 간격으로 쉬지 않고 10초간 계속 타이핑하는 극단적 케이스: 10s/350ms≈28회 발동×2건=최대 56건.
  # "디바운스 1회=1건"을 가정한 기존 30건/10s로는 15회(5.25초)만에 429가 나 부족했으므로 60건/10s로
  # 상향한다(Task 027 이월 갭 수정).
  search-throttle:
    limit: 60
    window: 10s

resilience4j:
  circuitbreaker:
    instances:
      upbit:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        # 존재하지 않는 마켓 코드(정상 200 + 빈 배열)는 외부 서비스 장애가 아니라 클라이언트 입력
        # 오류이므로 CB 실패 집계에서 제외한다.
        ignore-exceptions:
          - com.allfolio.domain.exception.TickerNotFoundException
      exchange-rate:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
      stock:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        # 요청 티커와 일치하는 종목코드가 없음(정상 200 응답, 매칭 실패)은 외부 서비스 장애가 아니라
        # 클라이언트 입력 오류이므로 CB 실패 집계에서 제외한다.
        ignore-exceptions:
          - com.allfolio.domain.exception.TickerNotFoundException
      twelvedata:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        # 존재하지 않는 심볼(정상 HTTP 404)은 외부 서비스 장애가 아니라 클라이언트 입력 오류이므로
        # CB 실패 집계에서 제외한다.
        ignore-exceptions:
          - com.allfolio.domain.exception.TickerNotFoundException

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        allfolio.simulation.duration: true
        allfolio.price.fetch.duration: true

logging:
  level:
    root: INFO
    com.allfolio: DEBUG
