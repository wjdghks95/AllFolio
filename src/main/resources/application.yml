spring:
  application:
    name: allfolio
  autoconfigure:
    # JWT 기반 무상태 인증이므로 인메모리 UserDetailsService가 필요 없다.
    # 제외하지 않으면 부팅 시 랜덤 생성 비밀번호가 로그에 남는다.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/allfolio
    username: allfolio
    password: allfolio
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

allfolio:
  jwt:
    # 하드코딩 금지 (docs/ROADMAP.md Task 003) — 환경변수 주입. 미설정 시 부팅 실패시켜 조용한 약한 키 사용을 막는다.
    secret: ${ALLFOLIO_JWT_SECRET:}
    access-token-ttl: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        allfolio.simulation.duration: true

logging:
  level:
    root: INFO
    com.allfolio: DEBUG
