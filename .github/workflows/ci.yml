name: CI

on:
  push:
    branches: [main]
  pull_request:

# 최소 권한: 체크아웃만 필요하다.
permissions:
  contents: read

# 같은 ref의 이전 실행은 최신 커밋 결과만 의미가 있으므로 취소한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # setup-java의 cache: gradle 대신 setup-gradle 사용 — 캐시 키·정리가 Gradle 인지형이고
      # PR에서는 캐시를 읽기만 해 main 캐시 오염을 막는다.
      - uses: gradle/actions/setup-gradle@v5

      # 시크릿은 리포지토리에 저장하지 않고 실행마다 생성한다.
      - name: Generate JWT secret
        run: echo "ALLFOLIO_JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # -PskipFrontend: 프론트 빌드(npm ci + vite)는 frontend job이 검증하므로 여기선 생략(Node 불필요).
      # Testcontainers(PostgreSQL/Redis)는 ubuntu-latest의 Docker를 그대로 사용한다.
      - name: Test
        run: ./gradlew test -PskipFrontend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
